{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/main.css' %}"  />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />"
    <title>Document</title>
</head> 
<body>
    <h1> The Ocean Views</h1>

    <a href="/posts/new">Create</a> 
    
 

    <ul>
        {% for post in posts %}
        <li>
            {% if post.image %}
      
    {% endif %}

            <p class="post-title"></p><b>Title:</b> {{ post.title}}: </p>
            <p class="post-content"></p><b>Body:</b> {{post.content}}</p>

          
                        <div style="display: flex; row-gap: 2px">

                            <a href="{% url 'single_post' post.id %}"><i style="color:green" class="fa fa-eye" aria-hidden="true"></i></a>
                            <a href="{% url 'profile' %}">Profile</a>
                                                 <a  href="{% url 'edit_post' post.id %}" ><i style="color:blue" class="fa fa-pen" aria-hidden="true"></i></a>
                            <form method="POST" action="{% url 'delete_post' post.id %}">   
                                {% csrf_token %}


                            <button type="submit"><i style="color:red" class="fa fa-trash" aria-hidden="true"></i></button>
                            </form>

                            </div>

        
        </li>
        {% endfor %}
    </ul>

    
<h2>Login</h2>

    <form method="POST">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username" required><br><br>

        <input type="password" name="password" placeholder="Password" required><br><br>

        <button type="submit">Login</button>
    </form>

    <form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Logout</button>
</form>


</body>
</html>
